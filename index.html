<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Title -->
    <h1>Infinite Scroll</h1>
    <h2>USING THE UNSPLASH API</h2>
    <!-- Loader -->
    <div class="loader" id="loader" hidden>
        <img src="animated-loading-icon.svg" alt="loading">
    </div>
    <!-- Image Container -->
    <div class="image-container" id="image-container">
        <img src="https://images.unsplash.com/photo-1515855334181-bb9b4d4c1d8a?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1366&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1515855334181-bb9b4d4c1d8a?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1366&q=80" alt="">
        <img src="https://images.unsplash.com/photo-1515855334181-bb9b4d4c1d8a?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1366&q=80" alt="">
    </div>
    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
